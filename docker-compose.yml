services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avya_home_crm}
      MYSQL_USER: ${MYSQL_USER:-avya}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root}
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-avya_home_crm}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-avya}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret-dev-secret-dev-secret}
    depends_on: [mysql]
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  mysql-data:
